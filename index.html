<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>入藏 · 西藏12日</title>
<meta name="theme-color" content="#7A2E32">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="入藏">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700&family=Noto+Sans+TC:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --earth:#E5DDCB; --paper:#FBF8F2;
    --benma:#7A2E32; --benma-deep:#571F24;
    --malachite:#2C6E5B; --orpiment:#B5811C;
    --gold-ink:#7D5710; --green-ink:#215446;
    --ink:#2B241D; --ink-dim:#6B6152;
    --line:rgba(43,36,29,0.16); --line-soft:rgba(43,36,29,0.09);
    --f1:#1F4F7A; --f2:#F5F1E7; --f3:#A33B34; --f4:#2C6E5B; --f5:#C99A2E;
    --nav-h:58px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{background:var(--earth);color:var(--ink);
    font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
    font-weight:400;line-height:1.62;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;}
  ::selection{background:var(--orpiment);color:#fff;}
  a{color:var(--benma);}

  /* ── 頂部：經幡 + 邊瑪牆標題列 ── */
  header{position:sticky;top:0;z-index:40;padding-top:env(safe-area-inset-top);background:var(--earth);}
  .string{border-top:1.5px solid rgba(43,36,29,0.45);display:flex;gap:2px;padding:0 1px;}
  .string i{flex:1;height:11px;}
  .string i:nth-child(5n+1){background:var(--f1);}
  .string i:nth-child(5n+2){background:var(--f2);}
  .string i:nth-child(5n+3){background:var(--f3);}
  .string i:nth-child(5n+4){background:var(--f4);}
  .string i:nth-child(5n+5){background:var(--f5);}
  .bb{background:var(--benma);padding:10px 18px 11px;position:relative;}
  .bb::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--benma-deep);}
  .bb-row{max-width:720px;margin:0 auto;display:flex;align-items:baseline;justify-content:space-between;gap:12px;}
  .bb-row h1{font-family:'Noto Serif TC',serif;font-weight:500;font-size:19px;color:#F5F1E7;margin:0;letter-spacing:.09em;}
  .bb-row .meta{font-family:'IBM Plex Mono',monospace;font-size:11px;color:rgba(245,241,231,0.68);letter-spacing:.05em;}
  .discs{display:flex;gap:8px;margin:6px auto 0;max-width:720px;}
  .discs i{width:4px;height:4px;border-radius:50%;background:var(--orpiment);opacity:.9;}

  main{max-width:720px;margin:0 auto;padding:16px 18px calc(var(--nav-h) + env(safe-area-inset-bottom) + 34px);}
  .view{display:none;} .view.on{display:block;}
  .intro{font-size:12.5px;color:var(--ink-dim);font-weight:300;margin:0 0 14px;}
  .intro b{color:var(--ink);font-weight:500;}
  .card{background:var(--paper);border:1px solid var(--line);padding:13px 15px;}
  .card + .card{margin-top:10px;}

  /* ── 今日 ── */
  .big{background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--benma);padding:18px 16px 16px;margin-bottom:12px;}
  .big .kicker{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--benma);text-transform:uppercase;margin-bottom:8px;}
  .big .huge{font-family:'Noto Serif TC',serif;font-weight:700;font-size:29px;line-height:1.15;margin:0 0 6px;letter-spacing:.01em;}
  .big .where{font-size:14px;color:var(--ink-dim);font-weight:300;margin-bottom:14px;}
  .altbar{display:flex;gap:10px;flex-wrap:wrap;}
  .altbox{flex:1;min-width:130px;background:rgba(43,36,29,0.05);padding:9px 12px;}
  .altbox .w{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-dim);letter-spacing:.08em;}
  .altbox .v{font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:500;color:var(--benma);}
  .altbox.peak .v{color:var(--gold-ink);}
  .countdown{font-family:'Noto Serif TC',serif;font-size:52px;font-weight:700;line-height:1;color:var(--benma);}
  .countdown small{font-family:'Noto Sans TC',sans-serif;font-size:15px;font-weight:400;color:var(--ink-dim);margin-left:6px;}

  /* ── 勾選 ── */
  .checks{margin-top:14px;padding-top:13px;border-top:1px solid var(--line-soft);}
  .checks h5{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-dim);margin:0 0 8px;font-weight:400;}
  .chk{display:flex;gap:11px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line-soft);cursor:pointer;}
  .chk:last-child{border-bottom:none;}
  .box{flex:0 0 18px;width:18px;height:18px;margin-top:2px;border:1.5px solid var(--ink-dim);position:relative;}
  .chk.key .box{border-color:var(--benma);}
  .chk.done .box{background:var(--malachite);border-color:var(--malachite);}
  .chk.done.key .box{background:var(--benma);border-color:var(--benma);}
  .chk.done .box::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid #FBF8F2;border-width:0 2px 2px 0;transform:rotate(42deg);}
  .chk .ct{font-size:13.5px;line-height:1.5;}
  .chk.done .ct{color:var(--ink-dim);text-decoration:line-through;text-decoration-color:rgba(43,36,29,0.3);}
  .chk .cs{display:block;font-size:11.5px;color:var(--ink-dim);font-weight:300;margin-top:1px;text-decoration:none;}

  .lines{margin-top:11px;padding-top:11px;border-top:1px solid var(--line-soft);display:grid;grid-template-columns:auto 1fr;gap:7px 10px;align-items:start;}
  .lines.nb{border-top:none;padding-top:0;margin-top:8px;}
  .tag{font-size:11px;font-weight:500;letter-spacing:.14em;padding:2px 6px 2px 7px;white-space:nowrap;background:rgba(43,36,29,0.07);color:var(--ink-dim);margin-top:2px;}
  .tag.key{background:rgba(122,46,50,0.11);color:var(--benma);}
  .tag.gold{background:rgba(181,129,28,0.2);color:var(--gold-ink);}
  .txt{font-size:12.5px;color:var(--ink-dim);font-weight:300;}
  .txt b{color:var(--ink);font-weight:500;}

  /* ── 行程 ── */
  .day{background:var(--paper);border:1px solid var(--line);padding:13px 15px;margin-bottom:10px;}
  .day.high{border-left:3px solid var(--benma);}
  .day.now{border:1px solid var(--benma);border-left:3px solid var(--benma);box-shadow:0 0 0 3px rgba(122,46,50,0.10);}
  .day.tbd{border-style:dashed;}
  .day-h{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap;margin-bottom:5px;}
  .dnum{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;background:rgba(122,46,50,0.11);color:var(--benma);padding:1px 7px;}
  .day.now .dnum{background:var(--benma);color:#F5F1E7;}
  .ddate{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-dim);letter-spacing:.04em;}
  .dalt{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--gold-ink);margin-left:auto;}
  .day-t{font-family:'Noto Serif TC',serif;font-weight:500;font-size:15.5px;letter-spacing:.02em;}
  .day-s{font-size:13px;color:var(--ink-dim);font-weight:300;margin-top:3px;}
  .grouphd{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-dim);margin:26px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line);}

  /* ── 交通軌 ── */
  .rail{position:relative;}
  .leg{position:relative;padding-left:32px;padding-bottom:14px;}
  .leg::before{content:"";position:absolute;left:5px;top:0;bottom:0;width:2px;background:rgba(43,36,29,0.22);}
  .leg.tour::before{background:rgba(181,129,28,0.6);}
  .leg.first::before{top:8px;}
  .leg.last::before{bottom:auto;height:8px;}
  .leg.shift::after{content:"";position:absolute;left:0;top:0;width:12px;height:2px;background:var(--ink-dim);}
  .node{position:absolute;left:0;top:3px;width:12px;height:12px;border-radius:50%;border:2px solid var(--malachite);background:var(--malachite);z-index:1;}
  .node.tour{border-color:var(--orpiment);background:var(--orpiment);}
  .node.wait{border-color:var(--benma);background:var(--paper);}
  .date{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-dim);letter-spacing:.05em;margin-bottom:3px;}
  .date em{font-style:normal;color:var(--gold-ink);}
  .ttl{font-family:'Noto Serif TC',serif;font-weight:500;font-size:15.5px;margin-bottom:7px;letter-spacing:.02em;}
  .row{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;}
  .data{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink-dim);}
  .data b{color:var(--ink);font-weight:500;}
  .pill{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.08em;padding:3px 8px;margin-left:auto;text-transform:uppercase;}
  .pill.ok{background:rgba(44,110,91,0.14);color:var(--green-ink);}
  .pill.wait{background:rgba(122,46,50,0.12);color:var(--benma);}
  .pill.tour{background:rgba(181,129,28,0.2);color:var(--gold-ink);}

  /* ── 住宿 ── */
  .stay{background:var(--paper);border:1px solid var(--line);padding:2px 15px;}
  .stay-row{padding:12px 0;border-bottom:1px solid var(--line-soft);}
  .stay-row:last-child{border-bottom:none;}
  .stay-row.now{background:rgba(122,46,50,0.05);margin:0 -15px;padding-left:12px;padding-right:15px;border-left:3px solid var(--benma);}
  .stay-d{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--benma);letter-spacing:.03em;}
  .stay-n{font-size:14px;font-weight:500;margin-top:1px;}
  .stay-m{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-dim);margin-top:3px;line-height:1.5;}
  .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
  .act{font-size:11.5px;letter-spacing:.06em;padding:5px 11px;border:1px solid var(--line);background:rgba(43,36,29,0.04);color:var(--ink);text-decoration:none;cursor:pointer;}
  .act.call{border-color:rgba(122,46,50,0.4);color:var(--benma);}
  .act:active{background:rgba(43,36,29,0.1);}

  /* ── 面板 ── */
  .panel{background:var(--paper);border:1px solid var(--line);padding:15px 15px 13px;}
  .panel + .panel{margin-top:11px;}
  .panel h4{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-dim);margin:0 0 11px;font-weight:400;}
  .dose{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
  .dose-cell{background:rgba(43,36,29,0.05);padding:10px 12px;}
  .dose-w{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-dim);letter-spacing:.07em;}
  .dose-a{font-family:'Noto Serif TC',serif;font-size:16px;font-weight:500;color:var(--benma);}
  .fact{display:flex;justify-content:space-between;gap:14px;font-size:13px;padding:7px 0;border-bottom:1px solid var(--line-soft);}
  .fact:last-of-type{border-bottom:none;}
  .fact span:first-child{color:var(--ink-dim);font-weight:300;}
  .fact span:last-child{font-family:'IBM Plex Mono',monospace;font-size:12.5px;text-align:right;}
  .fact.hi span:last-child{color:var(--gold-ink);font-weight:500;}
  .fact.bad span:last-child{color:var(--benma);font-weight:500;}
  .note{font-size:12.5px;color:var(--ink-dim);font-weight:300;margin:11px 0 0;padding-top:10px;border-top:1px solid var(--line-soft);}
  .note b{color:var(--benma);font-weight:500;}
  .steps{margin:0;padding-left:20px;font-size:13px;color:var(--ink-dim);font-weight:300;}
  .steps li{padding:4px 0;}
  .steps b{color:var(--ink);font-weight:500;}
  .steps li.first{color:var(--ink);}
  .steps li.first b{color:var(--benma);}

  .todo{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--benma);padding:13px 15px;margin-bottom:11px;}
  .todo-t{font-family:'Noto Serif TC',serif;font-weight:500;font-size:15px;margin-bottom:4px;}
  .todo-n{font-size:12.5px;color:var(--ink-dim);font-weight:300;}
  .todo-w{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--benma);display:block;margin-top:7px;}

  .contact{background:var(--paper);border:1px solid var(--line);padding:13px 15px;margin-bottom:10px;}
  .c-role{font-size:10.5px;letter-spacing:.13em;color:var(--ink-dim);margin-bottom:5px;}
  .c-name{font-family:'Noto Serif TC',serif;font-size:15px;font-weight:500;}
  .c-num{font-family:'IBM Plex Mono',monospace;font-size:13.5px;color:var(--benma);margin-top:1px;}
  .c-note{font-size:11.5px;color:var(--ink-dim);margin-top:4px;font-weight:300;}

  /* ── 摺疊 ── */
  details{background:var(--paper);border:1px solid var(--line);margin-bottom:11px;}
  details.sos{border-left:3px solid var(--benma);}
  details > summary{list-style:none;cursor:pointer;padding:13px 15px;font-family:'Noto Serif TC',serif;font-weight:500;font-size:15.5px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  details.sos > summary{color:var(--benma);}
  details > summary::-webkit-details-marker{display:none;}
  details > summary::after{content:"";width:7px;height:7px;border-right:1.5px solid var(--benma);border-bottom:1.5px solid var(--benma);transform:rotate(45deg);margin-right:3px;flex:0 0 auto;transition:transform .15s;}
  details[open] > summary::after{transform:rotate(-135deg);}
  details > summary .sn{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-dim);margin-left:auto;font-weight:400;}
  .dbody{padding:0 15px 14px;border-top:1px solid var(--line-soft);}
  .dbody > *:first-child{margin-top:13px;}
  .dbody .panel,.dbody .todo,.dbody .contact{border:none;padding:0;background:transparent;margin-bottom:0;}
  .dbody .todo{border-left:3px solid var(--benma);padding-left:12px;margin-bottom:14px;}
  .dbody .contact{border-bottom:1px solid var(--line-soft);padding-bottom:11px;margin-bottom:11px;}
  .dbody .contact:last-child{border-bottom:none;margin-bottom:0;}
  .dbody .panel + .panel{margin-top:15px;padding-top:13px;border-top:1px solid var(--line-soft);}

  /* ── 圖表 ── */
  .chart-card{background:var(--paper);border:1px solid var(--line);padding:16px 12px 8px;margin-bottom:12px;}
  .label{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-dim);margin:0 0 8px;}
  svg{display:block;width:100%;height:auto;overflow:visible;}
  .ax{font-family:'IBM Plex Mono',monospace;font-size:11px;fill:var(--ink-dim);}
  .pkl{font-family:'Noto Serif TC',serif;font-size:14px;fill:var(--benma);font-weight:500;}
  .elev{fill:none;stroke:var(--benma);stroke-width:2.2;stroke-linejoin:round;}
  .elevfill{fill:rgba(181,129,28,0.18);}
  .edot{fill:var(--paper);stroke:var(--benma);stroke-width:1.8;}
  .edot.peak{fill:var(--benma);}
  .cord{stroke:rgba(43,36,29,0.5);stroke-width:1;fill:none;}
  .here{fill:none;stroke:var(--benma);stroke-width:2;}
  .cap{font-size:12px;color:var(--ink-dim);margin:10px 4px 4px;font-weight:300;}


  /* ── 生日 ── */
  .bday{background:var(--paper);border:1px solid rgba(181,129,28,0.55);border-top:4px solid var(--orpiment);padding:0 0 16px;margin-bottom:12px;}
  .bday .fstr{display:flex;gap:2px;padding:0 1px;}
  .bday .fstr i{flex:1;height:26px;transform-origin:top center;}
  .bday .fstr i:nth-child(5n+1){background:var(--f1);}
  .bday .fstr i:nth-child(5n+2){background:var(--f2);}
  .bday .fstr i:nth-child(5n+3){background:var(--f3);}
  .bday .fstr i:nth-child(5n+4){background:var(--f4);}
  .bday .fstr i:nth-child(5n+5){background:var(--f5);}
  .bday .bd-in{padding:16px 17px 0;}
  .bday .kicker{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;color:var(--gold-ink);text-transform:uppercase;margin-bottom:9px;}
  .bday .bname{font-family:'Noto Serif TC',serif;font-weight:700;font-size:27px;line-height:1.2;margin:0 0 14px;}
  .bday p{font-family:'Noto Serif TC',serif;font-size:14.5px;font-weight:400;line-height:1.95;color:var(--ink);margin:0 0 12px;}
  .bday p:last-child{margin-bottom:0;}
  .bdayline{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--gold-ink);margin-top:7px;letter-spacing:.03em;}


  /* ── 生日卡動畫 ── */
  .bday.play .fstr i{animation:sway 4s ease-in-out infinite;}
  .bday.play .fstr i:nth-child(1){animation-delay:0.00s;}
  .bday.play .fstr i:nth-child(2){animation-delay:0.11s;}
  .bday.play .fstr i:nth-child(3){animation-delay:0.22s;}
  .bday.play .fstr i:nth-child(4){animation-delay:0.33s;}
  .bday.play .fstr i:nth-child(5){animation-delay:0.44s;}
  .bday.play .fstr i:nth-child(6){animation-delay:0.55s;}
  .bday.play .fstr i:nth-child(7){animation-delay:0.66s;}
  .bday.play .fstr i:nth-child(8){animation-delay:0.77s;}
  .bday.play .fstr i:nth-child(9){animation-delay:0.88s;}
  .bday.play .fstr i:nth-child(10){animation-delay:0.99s;}
  .bday.play .fstr i:nth-child(11){animation-delay:1.10s;}
  .bday.play .fstr i:nth-child(12){animation-delay:1.21s;}
  .bday.play .fstr i:nth-child(13){animation-delay:1.32s;}
  .bday.play .fstr i:nth-child(14){animation-delay:1.43s;}
  .bday.play .fstr i:nth-child(15){animation-delay:1.54s;}
  .bday.play .fstr i:nth-child(16){animation-delay:1.65s;}
  .bday.play .fstr i:nth-child(17){animation-delay:1.76s;}
  .bday.play .fstr i:nth-child(18){animation-delay:1.87s;}
  .bday.play .fstr i:nth-child(19){animation-delay:1.98s;}
  .bday.play .fstr i:nth-child(20){animation-delay:2.09s;}
  .bday.play .fstr i:nth-child(21){animation-delay:2.20s;}
  .bday.play .fstr i:nth-child(22){animation-delay:2.31s;}
  .bday.play .fstr i:nth-child(23){animation-delay:2.42s;}
  .bday.play .fstr i:nth-child(24){animation-delay:2.53s;}
  .bday.play .fstr i:nth-child(25){animation-delay:2.64s;}
  @keyframes sway{
    0%,100%{transform:rotate(0deg) scaleY(1);}
    25%    {transform:rotate(2.4deg) scaleY(1.06);}
    55%    {transform:rotate(-1.8deg) scaleY(0.97);}
    78%    {transform:rotate(1.2deg) scaleY(1.03);}
  }
  .bday.play .kicker,.bday.play .bname,.bday.play p{opacity:0;animation:rise .62s cubic-bezier(.2,.7,.3,1) both;}
  .bday.play .kicker{animation-delay:.10s;}
  .bday.play .bname{animation-delay:.26s;}
  .bday.play p:nth-of-type(1){animation-delay:.52s;}
  .bday.play p:nth-of-type(2){animation-delay:.74s;}
  .bday.play p:nth-of-type(3){animation-delay:.96s;}
  @keyframes rise{from{opacity:0;transform:translateY(9px);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion: reduce){
    .bday.play .fstr i,.bday.play .kicker,.bday.play .bname,.bday.play p{
      animation:none!important;opacity:1!important;transform:none!important;}
  }

  /* ── 夜空 ── */
  .bday{position:relative;}
  .sky{position:relative;overflow:hidden;background:linear-gradient(180deg,#0E1930 0%,#182642 58%,#20304E 100%);}
  .sky .st{position:absolute;border-radius:50%;opacity:.2;z-index:0;
    animation-name:tw;animation-iteration-count:infinite;animation-timing-function:ease-in-out;}

function gap(a,b){const p=s=>{const[y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d);};

function checks(id,items,heading){

    const k=it._k||`chk:${id}:${i}`, on=store.get(k)==='1';
    h+=`<div class="chk${on?' done':''}${it.key?' key':''}" data-k="${k}"><span class="box"></span>
      <span class="ct">${it.t}${it.s?`<span class="cs">${it.s}</span>`:''}</span></div>`;

}
function lines(arr,nb){
  if(!arr||!arr.length) return '';
  return `<div class="lines${nb?' nb':''}">`+arr.map(([t,x,c])=>

/* ═══ 海拔圖 ═══ */
function chart(){
  const pts=DAYS.map(x=>x.sleep||500), n=pts.length, L=20,R=980;
  const x=i=>L+i*(R-L)/(n-1), y=a=>260-(a/5200)*240;
  let line=''; pts.forEach((a,i)=>{line+=(i?' L':'M')+x(i).toFixed(1)+','+y(a).toFixed(1);});
  const area=line+` L${R},260 L${L},260 Z`;
  const ebc=8, ex=x(ebc), ey=y(5200);
  const fc=['#1F4F7A','#F5F1E7','#A33B34','#2C6E5B','#C99A2E'];
  let flags='';
  for(let s=-1;s<=1;s+=2){
    flags+=`<path class="cord" d="M${ex},${ey-2} L${(ex+s*118).toFixed(1)},${(ey+66).toFixed(1)}"/>`;
    for(let k=0;k<5;k++){const f=.18+k*.16, px=ex+s*f*118, py=ey+f*66;
      flags+=`<rect x="${(px-4).toFixed(1)}" y="${py.toFixed(1)}" width="8" height="10" fill="${fc[k]}"${k===1?' stroke="rgba(43,36,29,0.3)" stroke-width="0.5"':''}/>`;}
  }
  let dots=''; [0,2,4,8,12,14].forEach(i=>{
    dots+=`<circle class="edot${i===ebc?' peak':''}" cx="${x(i).toFixed(1)}" cy="${y(pts[i]).toFixed(1)}" r="${i===ebc?5.5:4}"/>`;});
  let here='';
  if(CUR>=0){const cx=x(CUR).toFixed(1), cy=y(pts[CUR]).toFixed(1);
    here=`<circle class="here" cx="${cx}" cy="${cy}" r="11"/><circle class="here" cx="${cx}" cy="${cy}" r="16" opacity="0.35"/>
      <text class="ax" x="${cx}" y="${(y(pts[CUR])-22).toFixed(1)}" text-anchor="middle" fill="#7A2E32">你在這</text>`;}
  return `<div class="chart-card"><p class="label">海拔曲線 · 過夜點</p>
    <svg viewBox="0 0 1000 300" preserveAspectRatio="xMidYMid meet" role="img" aria-label="全程過夜海拔曲線，最高點為9月2日珠峰大本營5200公尺">
    <line x1="20" y1="260" x2="980" y2="260" stroke="rgba(43,36,29,0.22)" stroke-width="1"/>
    <path class="elevfill" d="${area}"/><path class="elev" d="${line}"/>${flags}${dots}${here}
    <text class="pkl" x="${ex.toFixed(1)}" y="${(ey-10).toFixed(1)}" text-anchor="middle">珠峰大本營</text>
    <text class="ax" x="20" y="280" text-anchor="start">8/25 成都</text>
    <text class="ax" x="${x(2).toFixed(1)}" y="280" text-anchor="middle">8/27 林芝</text>
    <text class="ax" x="${x(4).toFixed(1)}" y="280" text-anchor="middle">8/29 拉薩</text>
    <text class="ax" x="${ex.toFixed(1)}" y="280" text-anchor="middle">9/2 EBC</text>
    <text class="ax" x="${x(12).toFixed(1)}" y="280" text-anchor="middle">9/6 拉薩</text>
    <text class="ax" x="980" y="280" text-anchor="end">9/8 桃園</text>
    <text class="ax" x="20" y="252" text-anchor="start">500m</text>
    <text class="ax" x="${(ex+16).toFixed(1)}" y="${(ey+4).toFixed(1)}" text-anchor="start" fill="#7D5710">5,200m</text>
    </svg><p class="cap">曲線為每晚的過夜海拔。白天的最高點另見行程頁——白天上到 5,248m 只是短暫暴露，晚上睡 5,200m 才是壓力來源。</p></div>`;
}

      <p class="note">以 7 月群組討論時的 <b>1 CNY ≈ NT$4.8</b> 試算。文件中無匯率記載，<b>實際以匯款或換匯當日匯率為準</b>。</p>
    </div></div></details>`;

  h+=`<details id="dt-etiquette"><summary>寺院與拍照禮儀<span class="sn">通則</span></summary><div class="dbody">
    <div class="panel">
      <div class="fact"><span>殿內</span><span>一律禁止拍照攝影</span></div>
      <div class="fact"><span>繞行</span><span>一律順時針，不可逆行</span></div>
      <div class="fact"><span>觸碰</span><span>勿碰佛像、經書、法器</span></div>
      <div class="fact"><span>指向</span><span>不可用手指指佛像，改用手掌朝上</span></div>
      <div class="fact"><span>衣著</span><span>進殿脫帽，避免短褲短裙</span></div>
      <div class="fact"><span>拍人</span><span>拍僧人或當地藏民須先徵得同意</span></div>
      <p class="note">適用於布達拉宮、大昭寺、扎基寺、色拉寺、白居寺、絨布寺、薩迦寺、扎什倫布寺、甘丹寺。庭院與外觀通常可拍，殿內一律不行。<b>若不確定就先問導遊。</b></p>
    </div></div></details>`;

  h+=`<details><summary>聯絡<span class="sn">${CONTACTS.length} 組</span></summary><div class="dbody">${
    CONTACTS.map(C=>`<div class="contact"><div class="c-role">${C.r}</div><div class="c-name">${C.n}</div>
      <div class="c-num">${C.v}</div><div class="c-note">${C.note}</div>
      ${C.tel?`<div class="acts"><a class="act call" href="tel:${C.tel}">撥打</a><span class="act" data-copy="${C.v}">複製號碼</span></div>`:''}</div>`).join('')
  }</div></details>`;

  h+=`<details><summary>行前準備<span class="sn" id="prepSn">${prepLeft()} 項未完成</span></summary><div class="dbody">
    ${checks('prep',PREP,`共 ${PREP.length} 項`)}</div></details>`;

  return h;
}

/* ═══ 渲染 ═══ */
const TABS=[
 {id:'today',label:'今日',el:'v-today',fn:viewToday},
 {id:'plan', label:'行程',el:'v-plan', fn:viewPlan},
 {id:'move', label:'交通',el:'v-move', fn:viewMove},
 {id:'stay', label:'住宿',el:'v-stay', fn:viewStay},
 {id:'memo', label:'備忘',el:'v-memo', fn:viewMemo}
];
let active=store.get('tab')||'today';
if(!TABS.some(t=>t.id===active)) active='today';

function badgeCount(){
  if(PHASE==='before') return prepLeft();
  if(PHASE==='during'){
    const t=DAYS[CUR].tasks?DAYS[CUR].tasks.filter((_,i)=>store.get(`chk:${DAYS[CUR].d}:${i}`)!=='1').length:0;
    return t+prepLeft();
  }
  return 0;
}
function renderNav(){
  const b=badgeCount();
  document.getElementById('nav').innerHTML=TABS.map(t=>
    `<button data-tab="${t.id}" class="${t.id===active?'on':''}"><span class="mk"></span>${t.label}${
      t.id==='today'&&b?`<span class="badge">${b}</span>`:''}</button>`).join('');
}
function renderAll(){
  TABS.forEach(t=>{
    const el=document.getElementById(t.el);
    el.innerHTML=t.fn();
    el.classList.toggle('on',t.id===active);
  });
  document.getElementById('hTitle').textContent=TABS.find(t=>t.id===active).label;
  document.getElementById('hMeta').textContent =
    PHASE==='before' ? `出發倒數 ${gap(TODAY,DAYS[0].d)} 天` :
    PHASE==='during' ? `${DAYS[CUR].dn||'成都'} · ${fmt(DAYS[CUR].d)}` : '行程已結束';
  renderNav();
  document.getElementById('netState').textContent=navigator.onLine?'線上':'離線模式';
  const md=document.getElementById('mapd');
  if(md) md.addEventListener('toggle',()=>store.set('mapOpen',md.open?'1':'0'));
}

document.addEventListener('click',e=>{
  const tab=e.target.closest('[data-tab]');
  if(tab){active=tab.dataset.tab;store.set('tab',active);renderAll();window.scrollTo(0,0);return;}
  const jp=e.target.closest('[data-jump]');
  if(jp){
    active='memo';store.set('tab',active);renderAll();window.scrollTo(0,0);
    const d=document.getElementById('dt-etiquette');
    if(d){d.open=true;setTimeout(()=>d.scrollIntoView({block:'start',behavior:'smooth'}),60);}
    return;
  }
  const cp=e.target.closest('[data-copy]');
  if(cp){copyText(cp.dataset.copy);return;}
  const chk=e.target.closest('.chk');
  if(chk){
    const on=chk.classList.toggle('done');
    store.set(chk.dataset.k,on?'1':'0');
    renderNav();
    const sn=document.getElementById('prepSn');
    if(sn) sn.textContent=prepLeft()+' 項未完成';
    return;
  }
});
window.addEventListener('online', ()=>document.getElementById('netState').textContent='線上');
window.addEventListener('offline',()=>document.getElementById('netState').textContent='離線模式');

renderAll();
if('serviceWorker' in navigator && location.protocol==='https:'){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
